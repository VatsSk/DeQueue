server:
  port: ${PORT:8080}
  error:
    include-message: always
    include-binding-errors: always

spring:
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  data:
    mongodb:
      uri: ${MONGO_URI:mongodb://localhost:27017/dequeue_db}
      auto-index-creation: true
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      timeout: 5000
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB
  cache:
    type: redis
    redis:
      time-to-live: 300000
      cache-null-values: false
  jackson:
    serialization:
      write-dates-as-timestamps: false
    default-property-inclusion: non_null

jwt:
  secret: 7vK9!qR2#Lm8@xP4$Tz6^Nc1&Wy5*Ha9%Js3+Fd8=Uk2!Gp7#Vr4@Qm6$Xn9
  expiration: ${JWT_EXPIRATION:86400000}
  refresh-expiration: ${JWT_REFRESH_EXPIRATION:604800000}

cloudinary:
  cloud-name: ${CLOUDINARY_CLOUD_NAME:demo}
  api-key: ${CLOUDINARY_API_KEY:key}
  api-secret: ${CLOUDINARY_API_SECRET:secret}

gemini:
  api-key: ${GEMINI_API_KEY:}

dequeue:
  vapid:
    public-key: ${VAPID_PUBLIC_KEY:}
    private-key: ${VAPID_PRIVATE_KEY:}
    subject: ${VAPID_SUBJECT:mailto:admin@dequeue.com}
  notification:
    channel: dequeue:order-status
  qr:
    base-url: ${QR_BASE_URL:http://localhost:8080}
  queue:
    default-prefix: "Q"
    max-queue-size: 100

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha
    display-request-duration: true
  show-actuator: false

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when-authorized

logging:
  level:
    root: INFO
    com.dequeue: DEBUG
    org.springframework.data.mongodb.core.MongoTemplate: DEBUG
    org.springframework.security: INFO
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] [%X{correlationId}] %-5level %logger{36} - %msg%n"

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:*}

cashfree:
  environment: ${CASHFREE_ENVIRONMENT:sandbox}
  client-id: ${CASHFREE_CLIENT_ID:}
  client-secret: ${CASHFREE_CLIENT_SECRET:}
  api-version: ${CASHFREE_API_VERSION:2023-08-01}
  webhook-secret: ${CASHFREE_WEBHOOK_SECRET:}
  easy-split-enabled: ${CASHFREE_EASY_SPLIT_ENABLED:false}
  base-url: ${CASHFREE_BASE_URL:}
  reconciliation:
    enabled: ${PAYMENT_RECONCILIATION_ENABLED:false}
    cron: ${PAYMENT_RECONCILIATION_CRON:0 0 2 * * ?}

platform:
  commission:
    type: ${PLATFORM_COMMISSION_TYPE:PERCENTAGE}
    rate: ${PLATFORM_COMMISSION_RATE:5.0}
