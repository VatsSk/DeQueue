<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reports - DeQueue</title>
    <link rel="stylesheet" href="css/base.css">
    <link rel="stylesheet" href="css/components.css">
    <link rel="stylesheet" href="css/layout.css">
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        .bar-chart { display: flex; align-items: flex-end; gap: 0.5rem; height: 200px; padding-top: 1rem; border-bottom: 1px solid var(--border); margin-bottom: 1rem; }
        .bar { background-color: var(--primary); width: 100%; border-radius: 4px 4px 0 0; min-height: 10px; transition: height 0.3s; position: relative; }
        .bar:hover { background-color: var(--primary-hover); }
        .bar-label { text-align: center; font-size: 0.75rem; color: var(--text-muted); margin-top: 0.5rem; }
    </style>
</head>
<body>
    <div class="app-layout">
        <aside class="sidebar" id="sidebar">
            <div class="sidebar-brand"><i data-lucide="qr-code"></i> DeQueue</div>
            <nav class="sidebar-nav">
                <a href="dashboard.html" class="nav-item"><i data-lucide="layout-dashboard"></i> Dashboard</a>
                <a href="reports.html" class="nav-item active"><i data-lucide="bar-chart-3"></i> Reports</a>
                <a href="settings.html" class="nav-item"><i data-lucide="settings"></i> Settings</a>
            </nav>
        </aside>

        <main class="main-content">
            <header class="header">
                <div class="flex items-center gap-4">
                    <button class="mobile-toggle btn-icon" onclick="document.getElementById('sidebar').classList.toggle('open')"><i data-lucide="menu"></i></button>
                    <h2 class="text-xl">Reports & Analytics</h2>
                </div>
                <button class="btn btn-secondary"><i data-lucide="download"></i> Export CSV</button>
            </header>

            <div class="page-content" id="reports-content">
                <div class="text-center text-muted p-8">
                    <i data-lucide="bar-chart-3" style="width: 48px; height: 48px; margin: 0 auto 1rem; opacity: 0.5;"></i>
                    <p>Loading reports data...</p>
                </div>
            </div>
        </main>
    </div>

    <script src="js/api.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/utils.js"></script>
    <script src="js/router.js"></script>
    <script src="js/reports.js"></script>
    <script>lucide.createIcons();</script>
</body>
</html>
