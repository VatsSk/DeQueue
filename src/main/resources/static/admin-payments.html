<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="icon" type="image/png" href="/favicon.png">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Payments Dashboard - DeQueue</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container-fluid">
            <a class="navbar-brand" href="#">DeQueue Admin</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav">
                    <li class="nav-item"><a class="nav-link active" href="#">Payments & Config</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="container mt-4">
        <h2>Admin Payments & Commission</h2>

        <!-- Commission Config -->
        <div class="card mt-4">
            <div class="card-header">Global Commission Configuration</div>
            <div class="card-body">
                <form id="config-form">
                    <div class="row">
                        <div class="col-md-4 mb-3">
                            <label>Commission Type</label>
                            <select id="commission-type" class="form-select">
                                <option value="PERCENTAGE">Percentage</option>
                                <option value="FIXED">Fixed Amount</option>
                            </select>
                        </div>
                        <div class="col-md-4 mb-3">
                            <label>Commission Rate/Amount</label>
                            <input type="number" id="commission-rate" class="form-control" step="0.01">
                        </div>
                        <div class="col-md-4 mb-3 d-flex align-items-end">
                            <button type="button" class="btn btn-primary w-100" onclick="saveConfig()">Save Configuration</button>
                        </div>
                    </div>
                </form>
            </div>
        </div>

        <!-- Financial Summary -->
        <div class="card mt-4">
            <div class="card-header">Financial Summary</div>
            <div class="card-body">
                <div class="row" id="summary-cards">
                    <!-- Cards populated via JS -->
                </div>
            </div>
        </div>

        <!-- Payments Table -->
        <div class="card mt-4 mb-5">
            <div class="card-header">Recent Payments</div>
            <div class="card-body">
                <table class="table table-striped">
                    <thead>
                        <tr>
                            <th>Order ID</th>
                            <th>Vendor</th>
                            <th>Amount</th>
                            <th>Source</th>
                            <th>Platform Comm.</th>
                            <th>CF Fees</th>
                            <th>Vendor Net</th>
                            <th>Date</th>
                        </tr>
                    </thead>
                    <tbody id="payments-body">
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script>
        const API_BASE = '/api/v1/admin/payments';
        const headers = {
            'Authorization': 'Bearer ' + localStorage.getItem('token'),
            'Content-Type': 'application/json'
        };

        async function loadConfig() {
            try {
                const res = await fetch(API_BASE + '/config', { headers });
                const json = await res.json();
                if (json.success) {
                    document.getElementById('commission-type').value = json.data.commissionType;
                    document.getElementById('commission-rate').value = json.data.commissionRate;
                }
            } catch (e) { console.error(e); }
        }

        async function saveConfig() {
            const type = document.getElementById('commission-type').value;
            const rate = parseFloat(document.getElementById('commission-rate').value);
            try {
                const res = await fetch(API_BASE + '/config/commission', {
                    method: 'POST',
                    headers,
                    body: JSON.stringify({ commissionType: type, commissionRate: rate })
                });
                const json = await res.json();
                if (json.success) {
                    alert('Configuration saved successfully');
                }
            } catch (e) { console.error(e); }
        }

        async function loadSummary() {
            try {
                const res = await fetch('/api/v1/admin/financial-summary', { headers });
                const json = await res.json();
                if (json.success) {
                    const d = json.data;
                    const cards = `
                        <div class="col-md-3 mb-3"><div class="card text-white bg-primary"><div class="card-body"><h6>Total GMV</h6><h4>â‚¹${d.totalGmv || 0}</h4></div></div></div>
                        <div class="col-md-3 mb-3"><div class="card text-white bg-success"><div class="card-body"><h6>Online GMV</h6><h4>â‚¹${d.onlineGmv || 0}</h4></div></div></div>
                        <div class="col-md-3 mb-3"><div class="card text-white bg-info"><div class="card-body"><h6>Platform Net Rev.</h6><h4>â‚¹${d.platformNetRevenue || 0}</h4></div></div></div>
                        <div class="col-md-3 mb-3"><div class="card text-white bg-warning"><div class="card-body"><h6>Offline Comm. Recv.</h6><h4>â‚¹${d.offlineCommissionReceivable || 0}</h4></div></div></div>
                        <div class="col-md-3 mb-3"><div class="card bg-light"><div class="card-body"><h6>Platform Comm.</h6><h4>â‚¹${d.platformGrossCommission || 0}</h4></div></div></div>
                        <div class="col-md-3 mb-3"><div class="card bg-light"><div class="card-body"><h6>CF Fees & Taxes</h6><h4>â‚¹${(d.cashfreeFees || 0) + (d.cashfreeTaxes || 0)}</h4></div></div></div>
                        <div class="col-md-3 mb-3"><div class="card bg-light"><div class="card-body"><h6>Vendor Net</h6><h4>â‚¹${d.totalVendorAmount || 0}</h4></div></div></div>
                        <div class="col-md-3 mb-3"><div class="card bg-light"><div class="card-body"><h6>Total Orders (On/Off)</h6><h4>${d.totalOrders || 0} (${d.onlineOrders || 0}/${d.offlineOrders || 0})</h4></div></div></div>
                    `;
                    document.getElementById('summary-cards').innerHTML = cards;
                }
            } catch (e) { console.error(e); }
        }

        async function loadPayments() {
            try {
                const res = await fetch(API_BASE, { headers });
                const json = await res.json();
                if (json.success) {
                    const tbody = document.getElementById('payments-body');
                    tbody.innerHTML = '';
                    json.data.forEach(p => {
                        const tr = document.createElement('tr');
                        tr.innerHTML = `
                            <td>${p.orderId}</td>
                            <td>${p.vendorId}</td>
                            <td>â‚¹${p.orderAmount}</td>
                            <td>${p.paymentSource}</td>
                            <td>â‚¹${p.platformCommission || 0}</td>
                            <td>â‚¹${(p.cashfreeFee || 0) + (p.cashfreeTax || 0)}</td>
                            <td>â‚¹${p.vendorNetAmount || 0}</td>
                            <td>${new Date(p.createdAt).toLocaleString()}</td>
                        `;
                        tbody.appendChild(tr);
                    });
                }
            } catch (e) { console.error(e); }
        }

        window.onload = () => {
            if (!localStorage.getItem('token')) {
                alert('Please login as admin first.');
                return;
            }
            loadConfig();
            loadSummary();
            loadPayments();
        };
    </script>
<script src="js/logo.js"></script>
</body>
</html>
