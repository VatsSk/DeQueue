<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Orders - Scan2Skip</title>
    <link rel="stylesheet" href="css/base.css">
    <link rel="stylesheet" href="css/components.css">
    <link rel="stylesheet" href="css/layout.css">
    <link rel="stylesheet" href="css/orders.css">
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body>
<div class="app-layout">
    <aside class="sidebar" id="sidebar">
        <div class="sidebar-brand"><i data-lucide="qr-code"></i> Scan2Skip</div>
        <nav class="sidebar-nav">
            <a href="dashboard.html" class="nav-item"><i data-lucide="layout-dashboard"></i> Dashboard</a>
            <a href="orders.html" class="nav-item active"><i data-lucide="list-ordered"></i> Orders</a>
            <a href="menu.html" class="nav-item"><i data-lucide="utensils"></i> Menu</a>
            <a href="categories.html" class="nav-item"><i data-lucide="tags"></i> Categories</a>
            <a href="customer.html" class="nav-item"><i data-lucide="smartphone"></i> Customer View</a>
        </nav>
    </aside>

    <main class="main-content">
        <header class="header" style="justify-content: space-between;">
            <div class="flex items-center gap-4">
                <button class="mobile-toggle btn-icon" onclick="document.getElementById('sidebar').classList.toggle('open')">
                    <i data-lucide="menu"></i>
                </button>
                <div>
                    <h2 class="text-xl">Orders</h2>
                    <div class="orders-live-indicator"><span></span> Live orders</div>
                </div>
            </div>
            <button id="create-order-btn" class="btn btn-primary" onclick="ordersApp.openCreateOrder()" style="display: none;"><i data-lucide="plus"></i> Create Order</button>
        </header>

        <div class="page-content orders-container">
            <section class="orders-toolbar">
                <div class="orders-summary" id="orders-summary"></div>

                <div class="orders-view-switcher" role="tablist" aria-label="Order view">
                    <button class="view-switch active" data-view="cards" type="button">
                        <i data-lucide="layout-grid"></i><span>Cards</span>
                    </button>
                    <button class="view-switch" data-view="table" type="button">
                        <i data-lucide="list"></i><span>Table</span>
                    </button>
                </div>
            </section>

            <section class="orders-filter-panel">
                <div class="orders-header">
                    <div class="orders-filters" id="orders-filters-container"></div>

                    <div class="orders-search-wrap">
                        <i data-lucide="search"></i>
                        <input id="order-search" type="text" class="form-control"
                               placeholder="Search Order #..." autocomplete="off">
                    </div>
                </div>

                <div class="orders-secondary-filters">
                    <label class="select-filter">
                        <span>Table</span>
                        <select id="table-filter"><option value="ALL">All Tables</option></select>
                    </label>
                    <label class="select-filter">
                        <span>Order Type</span>
                        <select id="type-filter">
                            <option value="ALL">All Types</option>
                            <option value="DINE_IN">Dine-in</option>
                            <option value="TAKEAWAY">Takeaway</option>
                            <option value="DELIVERY">Delivery</option>
                        </select>
                    </label>
                    <label class="select-filter">
                        <span>Payment</span>
                        <select id="payment-filter">
                            <option value="ALL">All Payments</option>
                            <option value="PAID">Paid</option>
                            <option value="UNPAID">Unpaid</option>
                            <option value="ONLINE">Online</option>
                            <option value="OFFLINE">Offline</option>
                        </select>
                    </label>
                    <label class="select-filter">
                        <span>Sort</span>
                        <select id="sort-filter">
                            <option value="WAITING">Longest Waiting</option>
                            <option value="NEWEST">Newest</option>
                            <option value="OLDEST">Oldest</option>
                            <option value="VALUE">Highest Value</option>
                        </select>
                    </label>
                    <button id="clear-order-filters" class="btn btn-secondary clear-filters" type="button">
                        <i data-lucide="rotate-ccw"></i> Reset
                    </button>
                </div>
            </section>

            <section class="orders-content">
                <div class="orders-grid" id="orders-grid"></div>
                <div class="orders-table-wrap" id="orders-table-wrap" hidden></div>
            </section>
        </div>
    </main>
</div>

<div class="modal-overlay" id="order-modal-overlay">
    <div class="modal order-details-modal">
        <div class="modal-header">
            <h3 id="order-modal-title">Order Details</h3>
            <button class="btn-icon" onclick="closeModal('order-modal')"><i data-lucide="x"></i></button>
        </div>
        <div class="modal-body" id="order-modal-body"></div>
        <div class="modal-footer">
            <button class="btn btn-secondary w-full" onclick="closeModal('order-modal')">Close</button>
        </div>
    </div>
</div>

<div class="modal-overlay" id="create-order-modal-overlay">
    <div class="modal" style="width: 100%; max-width: 600px; height: 90vh; display: flex; flex-direction: column; padding: 0;">
        <div class="modal-header" style="padding: 20px; border-bottom: 1px solid var(--dq-border);">
            <h3>Create Order</h3>
            <button class="btn-icon" onclick="ordersApp.closeCreateOrder()"><i data-lucide="x"></i></button>
        </div>
        
        <!-- Step 1: Menu List -->
        <div class="modal-body" id="co-step-menu" style="flex: 1; overflow-y: auto; padding: 20px;">
            <div id="create-order-error" class="text-danger mb-4 hidden"></div>
            <div>
                <input type="text" id="co-menu-search" class="form-control mb-4" placeholder="Search menu items..." oninput="ordersApp.renderCoMenu()">
                <div id="co-menu-list" style="display: flex; flex-direction: column; gap: 10px;">
                    <!-- Menu items -->
                </div>
            </div>
        </div>

        <!-- Step 2: Review & Update -->
        <div class="modal-body hidden" id="co-step-review" style="flex: 1; overflow-y: auto; padding: 20px;">
            <div id="co-review-error" class="text-danger mb-4 hidden"></div>
            <h4 class="mb-4">Order Summary</h4>
            <div id="co-review-items" class="mb-4"></div>
            
            <div class="mb-4" id="co-dynamic-fields">
                <!-- Dynamic custom fields rendered here -->
            </div>
            
            <div class="mb-4">
                <label class="form-label">Customer Note (Optional)</label>
                <input type="text" id="co-customer-note" class="form-control" placeholder="e.g. Less spicy">
            </div>

            <div class="mb-4" style="border-top: 1px dashed var(--dq-border); padding-top: 10px;">
                <div style="display:flex; justify-content: space-between; margin-bottom: 5px;"><span>Subtotal:</span> <span id="co-review-subtotal">₹0.00</span></div>
                <div style="display:flex; justify-content: space-between; color: var(--dq-text-muted); margin-bottom: 5px;" id="co-review-tax-row" class="hidden"><span>Tax (<span id="co-review-tax-label"></span>):</span> <span id="co-review-tax">₹0.00</span></div>
                <div style="display:flex; justify-content: space-between; color: var(--dq-text-muted); margin-bottom: 5px;" id="co-review-sc-row" class="hidden"><span>Service Charge:</span> <span id="co-review-sc">₹0.00</span></div>
                <div style="display:flex; justify-content: space-between; font-weight: bold; font-size: 1.2em; margin-top: 10px;"><span>Total:</span> <span id="co-review-total">₹0.00</span></div>
            </div>
        </div>

        <!-- Step 3: Success -->
        <div class="modal-body hidden" id="co-step-success" style="flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 20px;">
            <i data-lucide="check-circle" style="width: 64px; height: 64px; color: green; margin-bottom: 20px;"></i>
            <h3 class="mb-4">Order Created!</h3>
            <p style="font-size: 1.5em; font-weight: bold;">Order #<span id="co-success-order-number"></span></p>
        </div>

        <div class="modal-footer" id="co-footer-menu" style="display: flex; justify-content: space-between; align-items: center; padding: 20px; border-top: 1px solid var(--dq-border);">
            <div style="font-weight: bold; font-size: 1.2rem;">Total: ₹<span id="co-total-price">0.00</span></div>
            <div>
                <button class="btn btn-primary" onclick="ordersApp.coGoToReview()">Review & Update</button>
            </div>
        </div>
        
        <div class="modal-footer hidden" id="co-footer-review" style="display: flex; justify-content: space-between; align-items: center; padding: 20px; border-top: 1px solid var(--dq-border);">
            <button class="btn btn-secondary" onclick="ordersApp.coGoToMenu()">Back to Menu</button>
            <button id="co-submit-btn" class="btn btn-primary" onclick="ordersApp.submitOrder()">Place Order</button>
        </div>

        <div class="modal-footer hidden" id="co-footer-success" style="display: flex; justify-content: center; align-items: center; padding: 20px; border-top: 1px solid var(--dq-border);">
            <button class="btn btn-primary" onclick="ordersApp.openCreateOrder(true)">Create Another Order</button>
        </div>
    </div>
</div>

<div class="modal-overlay" id="co-customization-modal">
    <div class="modal" style="width: 100%; max-width: 400px; display: flex; flex-direction: column; max-height: 80vh; padding: 0;">
        <div class="modal-header" style="padding: 20px; border-bottom: 1px solid var(--dq-border);">
            <h3 id="co-cust-title">Customize</h3>
            <button class="btn-icon" onclick="ordersApp.closeCoCustomization()"><i data-lucide="x"></i></button>
        </div>
        <div class="modal-body" id="co-cust-body" style="flex: 1; overflow-y: auto; padding: 20px;">
        </div>
        <div class="modal-footer" style="padding: 20px; border-top: 1px solid var(--dq-border);">
            <button class="btn btn-primary w-full" id="co-cust-add-btn" onclick="ordersApp.addCoCustomizedItem()">Add to Order - ₹<span id="co-cust-btn-price">0</span></button>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/sockjs-client@1/dist/sockjs.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/stomp.js/2.3.3/stomp.min.js"></script>
<script src="js/api.js"></script>
<script src="js/auth.js"></script>
<script src="js/utils.js"></script>
<script src="js/router.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
<script src="js/orders.js?v=11"></script>
<script>lucide.createIcons();</script>
</body>
</html>
