<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="icon" type="image/png" href="/favicon.png">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Staff - DeQueue</title>
    <link rel="stylesheet" href="css/base.css">
    <link rel="stylesheet" href="css/components.css">
    <link rel="stylesheet" href="css/layout.css">
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        .staff-table { width: 100%; border-collapse: collapse; }
        .staff-table th, .staff-table td { padding: 1rem; text-align: left; border-bottom: 1px solid var(--border); }
        .staff-table th { color: var(--text-muted); font-weight: 500; font-size: 0.875rem; }
    </style>
</head>
<body>
    <div class="app-layout">
        <aside class="sidebar" id="sidebar">
            <div class="sidebar-brand"><img src="scan2skip-logo.svg" alt="Scan2Skip" class="sidebar-logo"></div>
            <nav class="sidebar-nav">
                <a href="dashboard.html" class="nav-item"><i data-lucide="layout-dashboard"></i> Dashboard</a>
                <a href="orders.html" class="nav-item"><i data-lucide="list-ordered"></i> Orders</a>
                <a href="menu.html" class="nav-item"><i data-lucide="utensils"></i> Menu</a>
                <a href="staff.html" class="nav-item active"><i data-lucide="users"></i> Staff</a>
                <a href="departments.html" class="nav-item"><i data-lucide="briefcase"></i> Departments</a>
            </nav>
        </aside>

        <main class="main-content">
            <header class="header">
                <div class="flex items-center gap-4">
                    <button class="mobile-toggle btn-icon" onclick="document.getElementById('sidebar').classList.toggle('open')"><i data-lucide="menu"></i></button>
                    <h2 class="text-xl">Staff Management</h2>
                </div>
            </header>

            <div class="page-content">
                <div class="flex justify-between items-center mb-6">
                    <input type="text" class="form-control" placeholder="Search staff..." style="max-width: 300px;">
                    <button class="btn btn-primary" onclick="openModal('add-staff-modal')"><i data-lucide="plus"></i> Add Staff</button>
                </div>

                <div class="card p-0 overflow-x-auto">
                    <table class="staff-table">
                        <thead>
                            <tr>
                                <th>Name</th>
                                <th>Role</th>
                                <th>Department</th>
                                <th>Status</th>
                                <th>Actions</th>
                            </tr>
                        </thead>
                        <tbody id="staffTableBody">
                            <tr><td colspan="5" class="text-center text-muted p-4">Loading staff...</td></tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </main>
    </div>

    <!-- Modal -->
    <div class="modal-overlay" id="add-staff-modal-overlay">
        <div class="modal">
            <div class="modal-header">
                <h3>Add Staff Member</h3>
                <button class="btn-icon" onclick="closeModal('add-staff-modal')"><i data-lucide="x"></i></button>
            </div>
            <div class="modal-body">
                <div class="form-group">
                    <label class="form-label">Full Name</label>
                    <input type="text" id="addStaffName" class="form-control" placeholder="e.g., Jane Doe">
                </div>
                <div class="form-group">
                    <label class="form-label">Email</label>
                    <input type="email" id="addStaffEmail" class="form-control" placeholder="jane@cafe.com">
                </div>
                <div class="form-group">
                    <label class="form-label">Temporary Password</label>
                    <input type="password" id="addStaffPassword" class="form-control" placeholder="â€¢â€¢â€¢â€¢â€¢â€¢â€¢â€¢">
                </div>
                <div class="grid grid-cols-2 gap-4">
                    <div class="form-group">
                        <label class="form-label">Role</label>
                        <select id="addStaffRole" class="form-control">
                            <option value="STAFF">Staff</option>
                            <option value="MANAGER">Manager</option>
                            <option value="ADMIN">Admin</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label class="form-label">Department</label>
                        <select id="addStaffDept" class="form-control">
                            <option value="">None</option>
                            <!-- Populated dynamically -->
                        </select>
                    </div>
                </div>
            </div>
            <div class="modal-footer">
                <button class="btn btn-secondary" onclick="closeModal('add-staff-modal')">Cancel</button>
                <button class="btn btn-primary" id="saveStaffBtn">Save</button>
            </div>
        </div>
    </div>

    <script src="js/api.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/utils.js"></script>
    <script src="js/router.js"></script>
    <script src="js/staff.js"></script>
    <script>lucide.createIcons();</script>
<script src="js/logo.js"></script>
</body>
</html>
