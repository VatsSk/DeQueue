<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Roles - DeQueue</title>
    <link rel="stylesheet" href="css/base.css">
    <link rel="stylesheet" href="css/components.css">
    <link rel="stylesheet" href="css/layout.css">
    <link rel="stylesheet" href="css/dashboard.css">
    <link rel="stylesheet" href="css/animations.css">
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        .permissions-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
            gap: 0.75rem;
            margin-top: 1rem;
        }
        
        .permission-card {
            background: var(--bg);
            border: 1px solid var(--border);
            border-radius: 6px;
            padding: 0.75rem;
            cursor: pointer;
            transition: all 0.2s ease;
        }
        
        .permission-card:hover {
            border-color: #10b981;
            background: rgba(16, 185, 129, 0.05);
        }
        
        .permission-card.selected {
            border-color: #10b981;
            background: rgba(16, 185, 129, 0.1);
        }
        
        .permission-card label {
            display: flex;
            align-items: flex-start;
            gap: 0.5rem;
            cursor: pointer;
            margin: 0;
        }
        
        .permission-card input[type="checkbox"] {
            margin-top: 0.25rem;
            flex-shrink: 0;
        }
        
        .permission-info {
            flex: 1;
        }
        
        .permission-key {
            font-weight: 600;
            color: var(--text);
            font-size: 0.875rem;
            margin-bottom: 0.25rem;
        }
        
        .permission-desc {
            font-size: 0.75rem;
            color: var(--text-muted);
            line-height: 1.4;
        }
        
        .modal-body {
            max-height: 70vh;
            overflow-y: auto;
        }
        
        .role-badge {
            display: inline-flex;
            align-items: center;
            gap: 0.375rem;
            padding: 0.25rem 0.625rem;
            background: rgba(16, 185, 129, 0.1);
            color: #10b981;
            border-radius: 4px;
            font-size: 0.75rem;
            font-weight: 500;
        }
        
        .empty-permissions {
            text-align: center;
            padding: 2rem;
            color: var(--text-muted);
        }
    </style>
</head>
<body>
    <div class="app-layout">
        <!-- Sidebar -->
        <aside class="sidebar" id="sidebar">
            <div class="sidebar-brand">
                <i data-lucide="qr-code"></i> DeQueue
            </div>
            <nav class="sidebar-nav">
                <!-- Dynamically populated by router.js -->
            </nav>
        </aside>

        <!-- Main Content -->
        <main class="main-content">
            <header class="header">
                <div class="flex items-center gap-4">
                    <button class="mobile-toggle btn-icon" onclick="document.getElementById('sidebar').classList.toggle('open')">
                        <i data-lucide="menu"></i>
                    </button>
                    <h2 class="text-xl">Roles Management</h2>
                </div>
                <div class="flex items-center gap-4">
                    <button class="btn btn-icon logout-btn" title="Logout" onclick="auth.logout()">
                        <i data-lucide="log-out"></i>
                    </button>
                </div>
            </header>

            <div class="page-content">
                <div class="flex items-center justify-between mb-6">
                    <div>
                        <h3>Custom Roles</h3>
                        <p class="text-muted">Create and manage custom roles with specific permissions</p>
                    </div>
                    <button class="btn btn-primary" onclick="showCreateRoleModal()">
                        <i data-lucide="plus"></i> Create Role
                    </button>
                </div>

                <!-- Roles Table -->
                <div class="card">
                    <div class="table-container">
                        <table class="table">
                            <thead>
                                <tr>
                                    <th>Role Name</th>
                                    <th>Description</th>
                                    <th>Permissions</th>
                                    <th>Status</th>
                                    <th>Actions</th>
                                </tr>
                            </thead>
                            <tbody id="roles-table-body">
                                <tr>
                                    <td colspan="5" class="text-center text-muted">Loading roles...</td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <!-- Create/Edit Role Modal -->
    <div id="role-modal" class="modal-overlay">
        <div class="modal-container" style="max-width: 800px;">
            <!-- Fixed Header -->
            <div class="modal-header">
                <h3 id="modal-title">Create Role</h3>
                <button class="btn btn-icon" onclick="closeRoleModal()" aria-label="Close modal">
                    <i data-lucide="x"></i>
                </button>
            </div>
            
            <!-- Scrollable Body -->
            <div class="modal-body">
                <form id="role-form">
                    <input type="hidden" id="role-id">
                    
                    <div class="form-group">
                        <label for="role-name">Role Name <span class="required">*</span></label>
                        <input type="text" id="role-name" class="form-input" placeholder="e.g., Kitchen Manager" required>
                    </div>

                    <div class="form-group">
                        <label for="role-description">Description</label>
                        <textarea id="role-description" class="form-input" placeholder="Brief description of this role" rows="2"></textarea>
                    </div>

                    <div class="form-group">
                        <label>Permissions <span class="required">*</span></label>
                        <p class="hint" style="margin-bottom: 1rem;">Select the permissions this role should have</p>
                        <div id="permissions-container" class="permissions-grid">
                            <div class="empty-permissions">
                                <i data-lucide="loader" class="spin"></i>
                                <p>Loading permissions...</p>
                            </div>
                        </div>
                    </div>
                </form>
            </div>
            
            <!-- Fixed Footer -->
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" onclick="closeRoleModal()">Cancel</button>
                <button type="submit" form="role-form" class="btn btn-primary" id="save-role-btn">
                    <i data-lucide="save"></i> Save Role
                </button>
            </div>
        </div>
    </div>

    <script src="js/api.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/utils.js"></script>
    <script src="js/router.js"></script>
    <script src="js/roles.js"></script>
    <script>
        lucide.createIcons();
    </script>
</body>
</html>
