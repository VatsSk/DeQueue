<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="icon" type="image/png" href="/favicon.png">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QR Code - DeQueue</title>
    <link rel="stylesheet" href="css/base.css">
    <link rel="stylesheet" href="css/components.css">
    <link rel="stylesheet" href="css/layout.css">
    <script src="https://unpkg.com/lucide@latest"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background-color: var(--bg-color); color: var(--text); }
        
        .qr-hero-section {
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem;
            min-height: calc(100vh - var(--header-height));
        }

        .qr-card {
            background: var(--surface);
            border-radius: 24px;
            box-shadow: 0 20px 40px -10px rgba(0,0,0,0.3), 0 0 0 1px rgba(255,255,255,0.05);
            overflow: hidden;
            max-width: 900px;
            width: 100%;
            display: grid;
            grid-template-columns: 1fr 1fr;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }
        
        .qr-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 24px 48px -12px rgba(0,0,0,0.12), 0 0 0 1px rgba(0,0,0,0.02);
        }

        .qr-visual-side {
            background: linear-gradient(135deg, rgba(20, 184, 166, 0.1) 0%, rgba(13, 148, 136, 0.2) 100%);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 4rem 2rem;
            position: relative;
        }
        
        .qr-visual-side::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background-image: radial-gradient(circle at 20px 20px, rgba(20, 184, 166, 0.1) 2px, transparent 0);
            background-size: 40px 40px;
            opacity: 0.5;
        }

        .qr-frame { background: #ffffff;
            padding: 1.5rem;
            border-radius: 20px;
            box-shadow: 0 12px 24px rgba(20, 184, 166, 0.15);
            position: relative;
            z-index: 1;
            transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            animation: float 6s ease-in-out infinite;
        }
        
        .qr-frame:hover {
            transform: scale(1.05);
        }

        @keyframes float {
            0% { transform: translateY(0px); }
            50% { transform: translateY(-10px); }
            100% { transform: translateY(0px); }
        }

        .qr-frame img {
            display: block;
            border-radius: 14px;
            width: 240px;
            height: 240px;
            object-fit: contain;
        }

        .qr-info-side {
            padding: 4rem 3rem;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .shop-badge {
            background: rgba(20, 184, 166, 0.1);
            color: #14b8a6;
            padding: 0.5rem 1rem;
            border-radius: 99px;
            font-size: 0.875rem;
            font-weight: 600;
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            margin-bottom: 1.5rem;
            align-self: flex-start;
        }

        .qr-info-side h3 {
            font-size: 2.25rem;
            font-weight: 700;
            color: var(--text);
            margin-bottom: 0.5rem;
            line-height: 1.2;
            letter-spacing: -0.02em;
        }

        .qr-info-side p {
            color: var(--text-muted);
            font-size: 1.125rem;
            margin-bottom: 2.5rem;
        }

        .action-group {
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }

        .btn-modern {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.75rem;
            padding: 1rem 1.5rem;
            border-radius: 12px;
            font-weight: 600;
            font-size: 1rem;
            transition: all 0.2s ease;
            cursor: pointer;
            border: none;
            width: 100%;
            outline: none;
        }

        .btn-modern.primary {
            background: #14b8a6;
            color: white;
            box-shadow: 0 4px 12px rgba(20, 184, 166, 0.25);
        }

        .btn-modern.primary:hover {
            background: #0d9488;
            transform: translateY(-2px);
            box-shadow: 0 6px 16px rgba(20, 184, 166, 0.3);
        }

        .btn-modern.secondary {
            background: #f1f5f9;
            color: #334155;
            border: 1px solid #e2e8f0;
        }

        .btn-modern.secondary:hover {
            background: #e2e8f0;
            color: var(--text);
            transform: translateY(-2px);
        }

        .btn-modern i {
            width: 20px;
            height: 20px;
        }
        
        .action-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1rem;
        }

        @media (max-width: 768px) {
            .qr-card { grid-template-columns: 1fr; }
            .qr-visual-side { padding: 3rem 2rem; }
            .qr-info-side { padding: 2rem; }
            .action-row { grid-template-columns: 1fr; }
            .qr-info-side h3 { font-size: 1.75rem; }
        }
    </style>
</head>
<body>
    <div class="app-layout">
        <aside class="sidebar" id="sidebar">
            <div class="sidebar-brand"><img src="scan2skip-logo.svg" alt="Scan2Skip" class="sidebar-logo"></div>
            <nav class="sidebar-nav">
                <a href="dashboard.html" class="nav-item"><i data-lucide="layout-dashboard"></i> Dashboard</a>
                <a href="qr.html" class="nav-item active"><i data-lucide="qr-code"></i> QR Code</a>
                <a href="profile.html" class="nav-item"><i data-lucide="store"></i> Shop Profile</a>
                <a href="settings.html" class="nav-item"><i data-lucide="settings"></i> Settings</a>
            </nav>
        </aside>

        <main class="main-content">
            <header class="header">
                <div class="flex items-center gap-4">
                    <button class="mobile-toggle btn-icon" onclick="document.getElementById('sidebar').classList.toggle('open')"><i data-lucide="menu"></i></button>
                    <h2 class="text-xl font-bold">QR Generation</h2>
                </div>
            </header>

            <div class="qr-hero-section">
                <div class="qr-card">
                    <!-- Visual Side with floating QR code -->
                    <div class="qr-visual-side">
                        <style>
                            .qr-logo-overlay {
                                position: absolute;
                                top: 50%;
                                left: 50%;
                                transform: translate(-50%, -50%);
                                background: white;
                                padding: 3px;
                                border-radius: 8px;
                                box-shadow: 0 2px 8px rgba(0,0,0,0.15);
                                z-index: 10;
                            }
                        </style>
                        <div class="qr-frame" id="qr-container" style="position: relative;">
                            <img src="data:image/gif;base64,R0lGODlhAQABAAD/ACwAAAAAAQABAAACADs=" alt="QR Code">
                            <img src="images/qr_logo.png" alt="Scan2Skip" class="qr-logo-overlay" style="width: 67px; height: 45px; object-fit: contain;">
                        </div>
                    </div>
                    
                    <!-- Information and Action Side -->
                    <div class="qr-info-side">
                        <div class="shop-badge">
                            <i data-lucide="store"></i> Live Menu Active
                        </div>
                                                <h3></h3>
                                                <div class="qr-steps" style="display: flex; align-items: center; gap: 1rem; margin-bottom: 2.5rem;">
                            <div style="display: flex; flex-direction: column; align-items: center; gap: 0.5rem; color: var(--text-muted);">
                                <div style="width: 48px; height: 48px; border-radius: 50%; background: #ccfbf1; color: #14b8a6; display: flex; align-items: center; justify-content: center;">
                                    <i data-lucide="scan-line"></i>
                                </div>
                                <span style="font-size: 0.875rem; font-weight: 600;">Scan</span>
                            </div>
                            <div style="color: #cbd5e1; display: flex; align-items: center; padding-bottom: 20px;"><i data-lucide="arrow-right" style="width: 20px; height: 20px;"></i></div>
                            <div style="display: flex; flex-direction: column; align-items: center; gap: 0.5rem; color: var(--text-muted);">
                                <div style="width: 48px; height: 48px; border-radius: 50%; background: #ccfbf1; color: #14b8a6; display: flex; align-items: center; justify-content: center;">
                                    <i data-lucide="smartphone-nfc"></i>
                                </div>
                                <span style="font-size: 0.875rem; font-weight: 600;">Order</span>
                            </div>
                            <div style="color: #cbd5e1; display: flex; align-items: center; padding-bottom: 20px;"><i data-lucide="arrow-right" style="width: 20px; height: 20px;"></i></div>
                            <div style="display: flex; flex-direction: column; align-items: center; gap: 0.5rem; color: var(--text-muted);">
                                <div style="width: 48px; height: 48px; border-radius: 50%; background: #ccfbf1; color: #14b8a6; display: flex; align-items: center; justify-content: center;">
                                    <i data-lucide="utensils-crossed"></i>
                                </div>
                                <span style="font-size: 0.875rem; font-weight: 600;">Served</span>
                            </div>
                        </div>
                        
                        <div class="action-group">
                                                        <button class="btn-modern primary btn-primary" onclick="window.qrApp.downloadPng()">
                                <i data-lucide="download-cloud"></i> Download High-Res Poster
                            </button>
                            <button class="btn-modern primary" style="background: #0ea5e9; box-shadow: 0 4px 12px rgba(14, 165, 233, 0.25);" onmouseover="this.style.background='#0284c7'; this.style.transform='translateY(-2px)'" onmouseout="this.style.background='#0ea5e9'; this.style.transform='translateY(0)'" onclick="window.qrApp.downloadCard()">
                                <i data-lucide="credit-card"></i> Download Card
                            </button>
                            
                            <div class="action-row">
                                <button class="btn-modern secondary" onclick="window.qrApp.copyLink()">
                                    <i data-lucide="link-2"></i> Copy Link
                                </button>
                                <button class="btn-modern secondary" onclick="window.print()">
                                    <i data-lucide="printer"></i> Print Code
                                </button>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <script src="js/api.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/utils.js"></script>
    <script src="js/router.js"></script>
    <script src="js/qr_logo_b64.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <script src="js/qr.js"></script>
    <script>lucide.createIcons();</script>
<script src="js/logo.js"></script>
</body>
</html>
