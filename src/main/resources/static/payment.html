<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="icon" type="image/png" href="/favicon.png">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Processing Payment</title>
    <link rel="stylesheet" href="css/base.css">
    <style>
        body { display: flex; flex-direction: column; justify-content: center; align-items: center; min-height: 100vh; background-color: #f8fafc; font-family: system-ui, sans-serif; margin: 0; }
        .spinner { border: 4px solid rgba(0,0,0,0.1); border-left-color: #4f46e5; border-radius: 50%; width: 40px; height: 40px; animation: spin 1s linear infinite; margin-bottom: 1rem; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>
    <div class="spinner"></div>
    <h2 style="margin:0 0 0.5rem 0; color: #1e293b;">Processing Secure Payment...</h2>
    <p style="color: #64748b;">Please wait, do not close this window.</p>

    <script>
        setTimeout(() => {
            const params = new URLSearchParams(window.location.search);
            const vendor = params.get('vendor') || '';
            window.location.href = `customer.html?vendor=${vendor}&payment=success`;
        }, 2000);
    </script>
</body>
</html>
