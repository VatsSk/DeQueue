<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shop Profile - DeQueue</title>
    <link rel="stylesheet" href="css/base.css">
    <link rel="stylesheet" href="css/components.css">
    <link rel="stylesheet" href="css/layout.css">
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body>
    <div class="app-layout">
        <aside class="sidebar" id="sidebar">
            <div class="sidebar-brand"><i data-lucide="qr-code"></i> DeQueue</div>
            <nav class="sidebar-nav">
                <a href="dashboard.html" class="nav-item"><i data-lucide="layout-dashboard"></i> Dashboard</a>
                <a href="qr.html" class="nav-item"><i data-lucide="qr-code"></i> QR Code</a>
                <a href="profile.html" class="nav-item active"><i data-lucide="store"></i> Shop Profile</a>
                <a href="settings.html" class="nav-item"><i data-lucide="settings"></i> Settings</a>
            </nav>
        </aside>

        <main class="main-content">
            <header class="header">
                <div class="flex items-center gap-4">
                    <button class="mobile-toggle btn-icon" onclick="document.getElementById('sidebar').classList.toggle('open')"><i data-lucide="menu"></i></button>
                    <h2 class="text-xl">Shop Profile</h2>
                </div>
                <button class="btn btn-primary" onclick="showToast('Profile Saved', 'success')"><i data-lucide="save"></i> Save Changes</button>
            </header>

            <div class="page-content" id="profile-content">
                <div class="text-center text-muted p-8">
                    <i data-lucide="store" style="width: 48px; height: 48px; margin: 0 auto 1rem; opacity: 0.5;"></i>
                    <p>Loading shop profile data...</p>
                </div>
            </div>
        </main>
    </div>

    <script src="js/api.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/utils.js"></script>
    <script src="js/router.js"></script>
    <script src="js/profile.js"></script>
    <script>lucide.createIcons();</script>
</body>
</html>
