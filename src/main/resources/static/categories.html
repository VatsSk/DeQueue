<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="icon" type="image/png" href="/favicon.png">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Categories - DeQueue</title>
    <link rel="stylesheet" href="css/base.css">
    <link rel="stylesheet" href="css/components.css">
    <link rel="stylesheet" href="css/layout.css">
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        .category-list { display: flex; flex-direction: column; gap: 1rem; }
        .category-row {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius-md);
            padding: 1rem 1.5rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .drag-handle { cursor: grab; color: var(--text-muted); margin-right: 1rem; }
    </style>
</head>
<body>
    <div class="app-layout">
        <!-- Sidebar -->
        <aside class="sidebar" id="sidebar">
            <div class="sidebar-brand"><img src="scan2skip-logo.svg" alt="Scan2Skip" class="sidebar-logo"></div>
            <nav class="sidebar-nav">
                <a href="dashboard.html" class="nav-item"><i data-lucide="layout-dashboard"></i> Dashboard</a>
                <a href="orders.html" class="nav-item"><i data-lucide="list-ordered"></i> Orders</a>
                <a href="menu.html" class="nav-item"><i data-lucide="utensils"></i> Menu</a>
                <a href="categories.html" class="nav-item active"><i data-lucide="tags"></i> Categories</a>
                <a href="customizations.html" class="nav-item"><i data-lucide="settings-2"></i> Customizations</a>
                <a href="customer.html" class="nav-item"><i data-lucide="smartphone"></i> Customer View</a>
            </nav>
        </aside>

        <!-- Main Content -->
        <main class="main-content">
            <header class="header">
                <div class="flex items-center gap-4">
                    <button class="mobile-toggle btn-icon" onclick="document.getElementById('sidebar').classList.toggle('open')"><i data-lucide="menu"></i></button>
                    <h2 class="text-xl">Categories</h2>
                </div>
            </header>

            <div class="page-content">
                <div class="flex justify-between items-center mb-6">
                    <input type="text" class="form-control" placeholder="Search categories..." style="max-width: 300px;">
                    <button class="btn btn-primary" onclick="openModal('add-category-modal')"><i data-lucide="plus"></i> Add Category</button>
                </div>
                <div class="category-list">
                    <!-- Populated by JS -->
                </div>
            </div>
        </main>
    </div>

    <!-- Modal -->
    <div class="modal-overlay" id="add-category-modal-overlay">
        <div class="modal">
            <div class="modal-header">
                <h3>Add Category</h3>
                <button class="btn-icon" onclick="closeModal('add-category-modal')"><i data-lucide="x"></i></button>
            </div>
            <div class="modal-body">
                <div class="form-group">
                    <label class="form-label">Category Name</label>
                    <input type="text" class="form-control" placeholder="e.g., Beverages">
                </div>
            </div>
            <div class="modal-footer">
                <button class="btn btn-secondary" onclick="closeModal('add-category-modal')">Cancel</button>
                <button class="btn btn-primary" onclick="showToast('Category Saved', 'success'); closeModal('add-category-modal')">Save</button>
            </div>
        </div>
    </div>

    <script src="js/api.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/utils.js"></script>
    <script src="js/router.js"></script>
    <script src="js/categories.js"></script>
    <script>lucide.createIcons();</script>
<script src="js/logo.js"></script>
</body>
</html>
